<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Hide scrollbar for cleaner UI */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">

    <!-- Navigation -->
    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showDashboard()">
                <i data-lucide="play-circle" class="text-red-600 w-8 h-8"></i>
                <span class="text-xl font-bold tracking-wider">StreamHub</span>
            </div>
            
            <div class="flex items-center gap-4 w-full sm:w-auto justify-end">
                <!-- Search Input -->
                <div class="relative flex items-center w-full sm:w-auto">
                    <i data-lucide="search" class="absolute left-3 w-5 h-5 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search movies & TV..." 
                        class="bg-gray-800 text-white border border-gray-700 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:border-red-600 transition-colors w-full sm:w-64">
                </div>
                <i data-lucide="user" class="w-5 h-5 text-gray-400 hover:text-white cursor-pointer hidden sm:block"></i>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard View -->
    <main id="dashboard-view" class="max-w-7xl mx-auto p-4 py-8">
        <!-- Tab Content Toggles (Hidden when searching) -->
        <div id="tab-container" class="flex gap-4 border-b border-gray-800 mb-6 pb-2">
            <button id="tab-movie" onclick="switchTab('movie')" class="flex items-center gap-2 text-lg font-medium border-b-2 border-red-600 pb-2 px-1 text-white transition-all">
                <i data-lucide="film" class="w-5 h-5"></i>
                <span>Movies</span>
            </button>
            <button id="tab-tv" onclick="switchTab('tv')" class="flex items-center gap-2 text-lg font-medium border-b-2 border-transparent pb-2 px-1 text-gray-400 hover:text-white transition-all">
                <i data-lucide="tv" class="w-5 h-5"></i>
                <span>TV Shows</span>
            </button>
        </div>

        <div class="flex items-center gap-2 mb-6">
            <i id="grid-icon" data-lucide="trending-up" class="w-6 h-6 text-red-600"></i>
            <h2 id="grid-title" class="text-2xl font-semibold">Trending Movies</h2>
        </div>
        
        <!-- Grid Structure -->
        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Dynamic Injection -->
        </div>
    </main>

    <!-- Player View -->
    <main id="player-view" class="max-w-7xl mx-auto p-4 py-8 hidden">
        <button onclick="showDashboard()" class="flex items-center gap-2 text-gray-400 hover:text-white mb-6 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            <span>Back to Browse</span>
        </button>

        <div class="bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800">
            <iframe 
                id="vidking-player"
                src="" 
                width="100%" 
                height="600" 
                frameborder="0" 
                allowfullscreen
                class="w-full aspect-video">
            </iframe>
        </div>

        <div class="mt-6 bg-gray-900 border border-gray-800 p-4 rounded-lg flex items-start gap-4">
            <i data-lucide="activity" class="w-6 h-6 text-green-500 mt-1"></i>
            <div>
                <h3 class="font-semibold mb-1">Watch Progress Debugger</h3>
                <p id="progress-log" class="text-gray-400 font-mono text-sm">Waiting for playback data...</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
