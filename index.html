<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<nav id="mainNav">
  <a class="nav-logo" href="#" onclick="showHome()">STREAM<span>HUBs</span></a>
  <div class="nav-links">
    <button class="nav-link active" id="navHome" onclick="showHome();setActiveNav(this)">Home</button>
    <button class="nav-link" id="navMovies" onclick="browseMovies();setActiveNav(this)">Movies</button>
    <button class="nav-link" id="navTV" onclick="browseTV();setActiveNav(this)">TV Shows</button>
    <button class="nav-link" id="navRecent" onclick="showRecent();setActiveNav(this)">Continue Watching</button>
    <button class="nav-link" id="navList" onclick="showMyList();setActiveNav(this)">My List</button>
  </div>
  <div class="nav-spacer"></div>
  <div class="search-wrap" id="searchWrap">
    <div class="search-box" id="searchBox">
      <svg class="search-icon-inner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search movies & shows..." oninput="debounceSearch(this.value)" onkeydown="if(event.key==='Escape')closeSearch()">
    </div>
    <button class="search-btn" onclick="toggleSearch()" title="Search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
  <!-- <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">
    <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button> -->
</nav>

<div class="home-content" id="homeContent">
  <div class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-vignette"></div>
    <div class="hero-vignette-side"></div>
    <div class="hero-content" id="heroContent">
      <div class="hero-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        <span id="heroBadge">Trending Now</span>
      </div>
      <div class="hero-title" id="heroTitle">Loading...</div>
      <div class="hero-meta">
        <div class="hero-rating">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="heroRating">—</span>
        </div>
        <div class="hero-dot"></div>
        <div class="hero-year" id="heroYear"></div>
        <div class="hero-dot"></div>
        <div class="hero-genre" id="heroGenre"></div>
      </div>
      <div class="hero-desc" id="heroDesc"></div>
      <div class="hero-btns">
        <button class="btn btn-primary" onclick="playFromHero()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Play Now
        </button>
        <button class="btn btn-glass" onclick="infoFromHero()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          More Info
        </button>
      </div>
    </div>
    <div class="hero-indicators" id="heroIndicators"></div>
  </div>

  <main>
    <div class="recently-section" id="recentlyWatched" style="display:none">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Continue Watching</div>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('recentRow',-1)">&#8249;</button>
        <div class="row" id="recentRow"></div>
        <button class="row-arrow right" onclick="scrollRow('recentRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Trending Today</div>
        <button class="section-more" onclick="browseMovies()">See all ›</button>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('trendMoviesRow',-1)">&#8249;</button>
        <div class="row" id="trendMoviesRow"></div>
        <button class="row-arrow right" onclick="scrollRow('trendMoviesRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Popular TV Shows</div>
        <button class="section-more" onclick="browseTV()">See all ›</button>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('trendTVRow',-1)">&#8249;</button>
        <div class="row" id="trendTVRow"></div>
        <button class="row-arrow right" onclick="scrollRow('trendTVRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Top Rated Movies</div>
        <button class="section-more" onclick="browseMovies()">See all ›</button>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('topRatedRow',-1)">&#8249;</button>
        <div class="row" id="topRatedRow"></div>
        <button class="row-arrow right" onclick="scrollRow('topRatedRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Now Playing in Cinemas</div>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('nowPlayingRow',-1)">&#8249;</button>
        <div class="row" id="nowPlayingRow"></div>
        <button class="row-arrow right" onclick="scrollRow('nowPlayingRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Action & Thriller</div>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('actionRow',-1)">&#8249;</button>
        <div class="row" id="actionRow"></div>
        <button class="row-arrow right" onclick="scrollRow('actionRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Must-Watch Series</div>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('topTVRow',-1)">&#8249;</button>
        <div class="row" id="topTVRow"></div>
        <button class="row-arrow right" onclick="scrollRow('topTVRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>Coming Soon</div>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('upcomingRow',-1)">&#8249;</button>
        <div class="row" id="upcomingRow"></div>
        <button class="row-arrow right" onclick="scrollRow('upcomingRow',1)">&#8250;</button>
      </div>
    </div>

    <div class="recently-section" id="myListSection" style="display:none">
      <div class="section-header">
        <div class="section-title"><div class="dot"></div>My List</div>
        <button class="section-more" onclick="showMyList()">See all ›</button>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="scrollRow('myListRow',-1)">&#8249;</button>
        <div class="row" id="myListRow"></div>
        <button class="row-arrow right" onclick="scrollRow('myListRow',1)">&#8250;</button>
      </div>
    </div>
  </main>
</div>

<div class="search-results" id="searchResults">
  <h2 style="font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1.5px;margin-bottom:6px" id="searchTitle">Search Results</h2>
  <p style="color:var(--text3);font-size:13px" id="searchCount"></p>
  <div class="search-grid" id="searchGrid"></div>
</div>

<div class="modal-overlay" id="detailModal" onclick="closeDetailModal(event)">
  <div class="modal" id="modalInner">
    <div class="modal-top">
      <div class="modal-image-loader" id="modalImageLoader">
        <div class="spinner"></div>
      </div>
      
      <img class="modal-backdrop" id="modalBackdrop" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
      <div class="modal-top-gradient"></div>
      <button class="modal-close" onclick="closeDetailModalBtn()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-actions" id="modalActions"></div>
      <div class="modal-overview" id="modalOverview"></div>
      <div id="modalCast"></div>
      <div id="modalEpisodes"></div>
    </div>
  </div>
</div>

<div class="player-modal-overlay" id="playerModal" onclick="closePlayerModal(event)">
  <div class="player-wrap" id="playerWrap">
    <div class="player-title" id="playerTitle">
      <span id="playerTitleText"></span>
    </div>
    <button class="player-close" onclick="closePlayerModalBtn()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Close Player
    </button>
    <iframe id="playerFrame" src="" allowfullscreen allow="fullscreen"></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
